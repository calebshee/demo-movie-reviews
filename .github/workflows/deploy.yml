name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Until Supabase is configured the site serves the demo build (sample data,
      # in-browser) instead of a "setup needed" notice. Setting both repository
      # variables switches the next deploy to the real app.
      - name: Build
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            npm run build
          else
            echo "::notice title=Demo build::SUPABASE_URL / SUPABASE_ANON_KEY are not set, so the demo build is deployed."
            npm run build:demo
          fi
        env:
          # Public values (the anon key is protected by Row Level Security); stored as
          # repository variables, not secrets, because they end up in the bundle anyway.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_AUTH_GOOGLE: ${{ vars.AUTH_GOOGLE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
